<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
  <meta name="theme-color" content="#0e0c0a"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Biblio"/>
  <title>Bibliothèque</title>
  <script src="https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Inconsolata:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    :root{
      --bg:#0e0c0a;--surface:#141210;--card:#1c1812;--card2:#221e14;
      --border:rgba(200,160,80,.12);--borderB:rgba(200,160,80,.30);
      --gold:#c8a050;--goldB:#e8c070;--rust:#8a3220;
      --greenT:rgba(74,122,58,.15);
      --text:#ede0c8;--dim:#8a7560;--faint:#3c3028;
      --T:env(safe-area-inset-top,0px);--B:env(safe-area-inset-bottom,0px)
    }
    html,body{height:100%;background:var(--bg)}
    body{
      font-family:'Inconsolata',monospace;color:var(--text);
      -webkit-font-smoothing:antialiased;
      display:flex;flex-direction:column;
      height:100dvh;overflow:hidden;padding-top:var(--T)
    }

    /* HEADER */
    .hdr{
      flex-shrink:0;z-index:200;
      background:rgba(14,12,10,.96);
      backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
      border-bottom:1px solid var(--border)
    }
    .hdr-top{padding:12px 18px;display:flex;align-items:center;gap:10px}
    .hdr-icon{font-size:1.4rem}
    .hdr-title{font-family:'Cormorant Garamond',serif;font-size:1.22rem;font-weight:600;letter-spacing:.03em;flex:1;line-height:1.1}
    .hdr-sub{font-size:.52rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);display:block;margin-top:1px}
    .hdr-badge{font-size:.6rem;color:var(--gold);background:var(--card);border:1px solid var(--borderB);padding:3px 10px;border-radius:20px;white-space:nowrap}

    /* BOTTOM NAV */
    .nav{
      position:fixed;bottom:0;left:0;right:0;z-index:300;
      background:rgba(14,12,10,.97);
      backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
      border-top:1px solid var(--border);
      display:flex;padding-bottom:var(--B)
    }
    .nav-btn{
      flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
      padding:9px 8px;background:none;border:none;cursor:pointer;
      color:var(--dim);font-family:'Inconsolata',monospace;
      font-size:.55rem;letter-spacing:.12em;text-transform:uppercase;
      border-top:2px solid transparent;transition:color .2s,border-color .2s
    }
    .nav-btn.active{color:var(--gold);border-top-color:var(--gold)}
    .nav-btn:active{opacity:.7}
    .nav-icon{font-size:1.25rem;line-height:1}

    /* PAGES */
    .pages{flex:1;overflow:hidden;position:relative}
    .page{
      position:absolute;inset:0;
      overflow-y:auto;overflow-x:hidden;
      -webkit-overflow-scrolling:touch;
      padding:14px 16px calc(var(--B) + 68px);
      display:flex;flex-direction:column;gap:12px;
      opacity:0;pointer-events:none;transform:translateX(30px);
      transition:opacity .22s ease,transform .22s ease
    }
    .page.active{opacity:1;pointer-events:auto;transform:none}
    .page.left{transform:translateX(-30px)}

    /* SCANNER PAGE */
    .cam-wrap{
      position:relative;border-radius:12px;overflow:hidden;
      background:#000;aspect-ratio:4/3;width:100%;
      border:1.5px solid var(--borderB)
    }
    #cam-video{width:100%;height:100%;object-fit:cover;display:block}

    /* Laser line */
    .cam-laser{
      position:absolute;left:10%;right:10%;top:50%;
      height:2px;margin-top:-1px;
      background:linear-gradient(90deg,transparent,var(--gold),var(--goldB),var(--gold),transparent);
      animation:laserPulse 1.5s ease-in-out infinite;
      pointer-events:none
    }
    @keyframes laserPulse{0%,100%{opacity:.4;transform:scaleX(.9)}50%{opacity:1;transform:scaleX(1)}}

    /* Corner guides */
    .cam-wrap::before,.cam-wrap::after{
      content:'';position:absolute;z-index:2;pointer-events:none;
      width:28px;height:28px;border-color:var(--gold);border-style:solid
    }
    .cam-wrap::before{top:12px;left:12px;border-width:2px 0 0 2px;border-radius:4px 0 0 0}
    .cam-wrap::after{bottom:12px;right:12px;border-width:0 2px 2px 0;border-radius:0 0 4px 0}

    .cam-overlay{
      position:absolute;inset:0;
      background:linear-gradient(180deg,rgba(14,12,10,.5) 0%,transparent 30%,transparent 70%,rgba(14,12,10,.5) 100%);
      pointer-events:none
    }
    .cam-hint{
      position:absolute;bottom:10px;left:0;right:0;
      text-align:center;font-size:.6rem;letter-spacing:.1em;
      text-transform:uppercase;color:rgba(232,192,112,.8)
    }
    .cam-isbn{
      position:absolute;top:10px;left:0;right:0;
      text-align:center;font-size:.72rem;letter-spacing:.08em;
      color:var(--goldB);font-weight:500;
      text-shadow:0 1px 4px rgba(0,0,0,.8)
    }

    .cam-controls{display:flex;gap:8px}
    .btn-cam{
      flex:1;padding:13px 8px;border-radius:8px;border:none;cursor:pointer;
      font-family:'Inconsolata',monospace;font-size:.72rem;font-weight:500;
      letter-spacing:.1em;text-transform:uppercase;
      display:flex;align-items:center;justify-content:center;gap:7px;
      transition:opacity .15s,transform .15s
    }
    .btn-cam:active{transform:scale(.97);opacity:.85}
    .btn-cam.pri{background:var(--gold);color:var(--bg)}
    .btn-cam.sec{background:var(--card);color:var(--text);border:1px solid var(--border)}
    .btn-cam:disabled{opacity:.3;cursor:not-allowed}

    /* Pending book card (after scan) */
    .pending-card{
      background:var(--card);border:1px solid var(--borderB);border-radius:10px;
      overflow:hidden;animation:up .25s ease both
    }
    .pending-cover{
      display:flex;gap:14px;padding:14px
    }
    .cover-img{
      width:60px;height:85px;object-fit:cover;border-radius:4px;
      background:var(--surface);flex-shrink:0;border:1px solid var(--border)
    }
    .cover-placeholder{
      width:60px;height:85px;border-radius:4px;background:var(--surface);
      flex-shrink:0;border:1px solid var(--border);
      display:flex;align-items:center;justify-content:center;
      font-size:1.5rem;opacity:.4
    }
    .pending-meta{flex:1;min-width:0}
    .pending-title{font-family:'Cormorant Garamond',serif;font-size:1.05rem;font-weight:600;line-height:1.3;margin-bottom:4px}
    .pending-author{font-size:.68rem;color:var(--gold);font-style:italic;margin-bottom:8px}
    .pending-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
    .pending-isbn{font-size:.58rem;color:var(--faint);margin-top:4px}
    .pending-actions{display:flex;gap:8px;padding:0 14px 14px}

    /* Loader inline */
    .ldr{display:none;flex-direction:column;gap:8px}
    .ldr.on{display:flex}
    .ldr-lbl{font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);text-align:center;animation:blink 1.3s ease-in-out infinite}
    @keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}
    .ldr-track{height:2px;background:var(--surface);border-radius:2px;overflow:hidden}
    .ldr-fill{height:100%;background:linear-gradient(90deg,var(--rust),var(--goldB));animation:sweep 1.8s ease-in-out infinite}
    @keyframes sweep{0%{width:0%;margin-left:0}50%{width:65%;margin-left:18%}100%{width:0%;margin-left:100%}}

    /* Tags */
    .t{font-size:.52rem;letter-spacing:.07em;text-transform:uppercase;padding:2px 7px;border-radius:3px}
    .t.yr{background:rgba(200,160,80,.09);color:rgba(200,160,80,.6);border:1px solid rgba(200,160,80,.15)}
    .t.ln{background:rgba(255,255,255,.03);color:var(--faint);border:1px solid var(--border)}
    .t.gn{background:rgba(138,50,32,.1);color:#c06858;border:1px solid rgba(138,50,32,.18)}

    /* Action buttons */
    .btn-action{
      flex:1;padding:11px 8px;border-radius:7px;border:none;cursor:pointer;
      font-family:'Inconsolata',monospace;font-size:.68rem;font-weight:500;
      letter-spacing:.1em;text-transform:uppercase;
      display:flex;align-items:center;justify-content:center;gap:6px;
      transition:opacity .15s,transform .15s
    }
    .btn-action:active{transform:scale(.97);opacity:.85}
    .btn-action.add{background:var(--gold);color:var(--bg)}
    .btn-action.skip{background:var(--card);color:var(--dim);border:1px solid var(--border)}

    /* err */
    .err{background:rgba(138,50,32,.1);border:1px solid var(--rust);border-radius:8px;padding:12px 14px;color:#bf6858;font-size:.68rem;line-height:1.7}
    .err strong{display:block;margin-bottom:3px}

    /* HISTORY (recently scanned) */
    .section-ttl{font-family:'Cormorant Garamond',serif;font-size:1rem;font-weight:400;color:var(--dim)}
    .sep{height:1px;background:linear-gradient(90deg,transparent,var(--borderB),transparent);flex-shrink:0}

    /* LIBRARY TOOLBAR */
    .lib-toolbar{
      position:sticky;top:0;z-index:50;background:var(--bg);
      margin:-14px -16px 0;padding:12px 16px 10px;
      border-bottom:1px solid var(--border);
      display:flex;flex-direction:column;gap:8px
    }
    .search-wrap{position:relative}
    .s-input{
      width:100%;background:var(--surface);border:1px solid var(--border);
      border-radius:8px;padding:10px 36px 10px 36px;
      font-family:'Inconsolata',monospace;font-size:.75rem;color:var(--text);
      outline:none;transition:border-color .2s
    }
    .s-input::placeholder{color:var(--faint)}
    .s-input:focus{border-color:var(--borderB)}
    .s-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:.9rem;opacity:.35;pointer-events:none}
    .s-clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--faint);font-size:1rem;cursor:pointer;padding:2px;line-height:1;display:none}
    .s-clear.visible{display:block}

    .genre-select-wrap{position:relative;display:flex;align-items:center}
    .genre-select-icon{position:absolute;left:11px;font-size:.85rem;opacity:.45;pointer-events:none;z-index:1}
    .genre-select-arrow{position:absolute;right:11px;font-size:.65rem;color:var(--dim);pointer-events:none}
    .genre-select{
      width:100%;background:var(--surface);border:1px solid var(--border);
      border-radius:8px;padding:9px 32px 9px 32px;
      font-family:'Inconsolata',monospace;font-size:.72rem;color:var(--text);
      outline:none;appearance:none;-webkit-appearance:none;cursor:pointer;transition:border-color .2s
    }
    .genre-select:focus{border-color:var(--borderB)}
    .genre-select option{background:var(--card);color:var(--text)}

    .sort-row{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none}
    .sort-row::-webkit-scrollbar{display:none}
    .sort-lbl{font-size:.55rem;color:var(--faint);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;flex-shrink:0}
    .sort-btn{
      flex-shrink:0;padding:5px 10px;border-radius:5px;
      font-family:'Inconsolata',monospace;font-size:.55rem;letter-spacing:.07em;text-transform:uppercase;
      cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--dim);
      transition:all .15s;white-space:nowrap
    }
    .sort-btn.on{border-color:var(--borderB);color:var(--text);background:var(--card)}
    .sort-btn:active{transform:scale(.95)}

    /* Book card in library */
    .bk{
      background:var(--card);border:1px solid var(--border);border-radius:8px;
      padding:11px 13px 11px 16px;position:relative;overflow:hidden;
      animation:up .28s ease both
    }
    @keyframes up{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
    .bk::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--rust),var(--gold));border-radius:3px 0 0 3px}
    .bk-row{display:flex;align-items:flex-start;gap:9px}
    .bk-n{font-family:'Cormorant Garamond',serif;font-size:1.2rem;font-weight:300;line-height:1;color:var(--faint);min-width:22px;padding-top:2px;flex-shrink:0}
    .bk-body{flex:1;min-width:0}
    .bk-title{font-family:'Cormorant Garamond',serif;font-size:.97rem;font-weight:600;color:var(--text);line-height:1.3}
    .bk-author{font-size:.66rem;color:var(--gold);font-style:italic;margin-top:2px}
    .bk-del{flex-shrink:0;background:none;border:none;color:var(--faint);font-size:1.1rem;cursor:pointer;padding:0 2px;line-height:1;transition:color .15s}
    .bk-del:active{color:#bf6858}
    .bk-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}

    /* Library empty */
    .lib-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:44px 20px}
    .lib-empty-icon{font-size:3.5rem;opacity:.22}
    .lib-empty h3{font-family:'Cormorant Garamond',serif;font-size:1.2rem;font-weight:300;color:var(--dim)}
    .lib-empty p{font-size:.65rem;color:var(--faint);line-height:1.75;max-width:200px}
    .btn-goto{background:var(--gold);color:var(--bg);border:none;border-radius:7px;padding:11px 22px;font-family:'Inconsolata',monospace;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;margin-top:4px;transition:opacity .15s}
    .btn-goto:active{opacity:.8}

    .no-res{text-align:center;padding:28px 20px;color:var(--faint);font-size:.67rem;font-style:italic}
    .info-bar{font-size:.59rem;color:var(--faint);letter-spacing:.05em;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:4px}
    .info-bar span{color:var(--dim)}
    .info-bar em{color:var(--gold);font-style:normal}

    .act-row{display:flex;gap:7px;flex-wrap:wrap}
    .btn-act{
      flex:1;min-width:0;background:var(--card);border:1px solid var(--border);border-radius:7px;
      color:var(--dim);padding:10px 8px;
      font-family:'Inconsolata',monospace;font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;
      cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;transition:all .15s
    }
    .btn-act:active{background:var(--card2);border-color:var(--borderB);color:var(--gold)}
    .btn-act.danger{color:var(--faint)}
    .btn-act.danger:active{color:#bf6858;border-color:rgba(154,58,40,.4)}

    /* TOAST */
    .toast{
      position:fixed;bottom:calc(var(--B) + 68px);left:50%;transform:translateX(-50%) translateY(60px);
      background:var(--card);border:1px solid var(--borderB);color:var(--gold);
      padding:9px 18px;border-radius:20px;font-size:.66rem;letter-spacing:.08em;
      z-index:999;transition:transform .28s ease;white-space:nowrap;pointer-events:none
    }
    .toast.show{transform:translateX(-50%) translateY(0)}
  </style>
</head>
<body>

<!-- HEADER -->
<div class="hdr">
  <div class="hdr-top">
    <span class="hdr-icon" id="hdr-icon">📷</span>
    <div style="flex:1">
      <div class="hdr-title" id="hdr-title">Scanner</div>
      <span class="hdr-sub" id="hdr-sub">Code-barres ISBN</span>
    </div>
    <div class="hdr-badge" id="hdr-badge">0 livre</div>
  </div>
</div>

<!-- PAGES -->
<div class="pages">

  <!-- ══ PAGE SCANNER ══ -->
  <div class="page active" id="page-scan">

    <!-- Viewfinder caméra -->
    <div class="cam-wrap" id="cam-wrap">
      <video id="cam-video" autoplay muted playsinline></video>
      <div class="cam-overlay"></div>
      <div class="cam-laser" id="cam-laser"></div>
      <div class="cam-isbn" id="cam-isbn"></div>
      <div class="cam-hint" id="cam-hint">Pointez vers un code-barres ISBN</div>
    </div>

    <!-- Boutons caméra -->
    <div class="cam-controls">
      <button class="btn-cam pri" id="btn-start" onclick="startScan()">▶ Démarrer la caméra</button>
      <button class="btn-cam sec" id="btn-stop" onclick="stopScan()" style="display:none">⏹ Arrêter</button>
      <button class="btn-cam sec" id="btn-torch" onclick="toggleTorch()" style="display:none">🔦</button>
    </div>

    <!-- Loader recherche infos -->
    <div class="ldr" id="ldr">
      <div class="ldr-lbl" id="lbl">Recherche du livre…</div>
      <div class="ldr-track"><div class="ldr-fill"></div></div>
    </div>

    <!-- Livre détecté en attente -->
    <div id="pending-wrap"></div>

    <!-- Erreur -->
    <div id="scan-err" style="display:none" class="err">
      <strong>⚠ Livre introuvable</strong>
      <span id="scan-err-msg"></span>
    </div>

    <!-- Séparateur + historique session -->
    <div id="session-section" style="display:none">
      <div class="sep"></div>
      <div class="section-ttl">Scannés ce soir</div>
      <div id="session-list"></div>
    </div>

  </div>

  <!-- ══ PAGE BIBLIOTHÈQUE ══ -->
  <div class="page" id="page-lib">

    <div class="lib-toolbar">
      <div class="search-wrap">
        <span class="s-icon">🔍</span>
        <input class="s-input" id="s-input" type="search" placeholder="Titre, auteur, genre…" oninput="onSearch()"/>
        <button class="s-clear" id="s-clear" onclick="clearSearch()">✕</button>
      </div>
      <div class="genre-select-wrap">
        <span class="genre-select-icon">🏷</span>
        <select class="genre-select" id="genre-select" onchange="setGenre(this.value)">
          <option value="all">Tous les genres</option>
        </select>
        <span class="genre-select-arrow">▾</span>
      </div>
      <div class="sort-row">
        <span class="sort-lbl">Tri :</span>
        <button class="sort-btn on" data-s="date"   onclick="setSort('date')">⬇ Récent</button>
        <button class="sort-btn"    data-s="title"  onclick="setSort('title')">Titre A-Z</button>
        <button class="sort-btn"    data-s="author" onclick="setSort('author')">Auteur</button>
        <button class="sort-btn"    data-s="year"   onclick="setSort('year')">Année</button>
      </div>
    </div>

    <div id="lib-info" style="display:none">
      <div class="info-bar" id="info-text"></div>
      <div class="act-row">
        <button class="btn-act" onclick="exportCSV()">⬇ CSV</button>
        <button class="btn-act" onclick="exportJSON()">💾 Sauvegarder</button>
        <button class="btn-act" onclick="importJSON()">📂 Importer</button>
        <button class="btn-act danger" onclick="clearLib()">🗑</button>
      </div>
    </div>

    <div class="lib-empty" id="lib-empty">
      <div class="lib-empty-icon">📚</div>
      <h3>Bibliothèque vide</h3>
      <p>Scannez les codes-barres de vos livres pour les ajouter ici</p>
      <button class="btn-goto" onclick="showPage('scan')">📷 Scanner un livre</button>
    </div>

    <div class="no-res" id="no-res" style="display:none">Aucun résultat.</div>
    <div id="lib-list"></div>

  </div>
</div>

<!-- BOTTOM NAV -->
<nav class="nav">
  <button class="nav-btn active" id="nav-scan" onclick="showPage('scan')">
    <span class="nav-icon">📷</span>Scanner
  </button>
  <button class="nav-btn" id="nav-lib" onclick="showPage('lib')">
    <span class="nav-icon">📚</span>Bibliothèque
  </button>
</nav>

<div class="toast" id="toast"></div>

<script>
/* ═══════════════════════════
   STATE
═══════════════════════════ */
const $=id=>document.getElementById(id);
let currentPage='scan', currentSort='date', currentGenre='all';
let library=[], sessionBooks=[];
let codeReader=null, scanning=false, torchOn=false, torchTrack=null;
let lastScannedISBN='', scanCooldown=false;

/* ═══════════════════════════
   INDEXEDDB STORAGE
═══════════════════════════ */
let _db=null;
function openDB(){
  return new Promise((res,rej)=>{
    if(_db){res(_db);return}
    const req=indexedDB.open('bibliotheque',1);
    req.onupgradeneeded=e=>e.target.result.createObjectStore('data');
    req.onsuccess=e=>{_db=e.target.result;res(_db)};
    req.onerror=e=>rej(e.target.error);
  });
}
async function dbGet(k){const db=await openDB();return new Promise((r,j)=>{const req=db.transaction('data','readonly').objectStore('data').get(k);req.onsuccess=()=>r(req.result);req.onerror=e=>j(e)})}
async function dbSet(k,v){const db=await openDB();return new Promise((r,j)=>{const req=db.transaction('data','readwrite').objectStore('data').put(v,k);req.onsuccess=()=>r();req.onerror=e=>j(e)})}
async function saveLib(){try{await dbSet('bib_v3',library)}catch(e){console.warn(e)}updateBadge()}
async function initLib(){try{library=await dbGet('bib_v3')||[]}catch(e){library=[]}updateBadge()}

/* ═══════════════════════════
   NAVIGATION
═══════════════════════════ */
const HDR={scan:{icon:'📷',title:'Scanner',sub:'Code-barres ISBN'},lib:{icon:'📚',title:'Ma Bibliothèque',sub:'Collection personnelle'}};

function showPage(p){
  currentPage=p;
  const pScan=$('page-scan'),pLib=$('page-lib');
  if(p==='scan'){pLib.classList.remove('active');pLib.classList.add('left');pScan.classList.remove('left');pScan.classList.add('active')}
  else{pScan.classList.remove('active');pLib.classList.remove('left');pLib.classList.add('active');renderLib()}
  $('nav-scan').classList.toggle('active',p==='scan');
  $('nav-lib').classList.toggle('active',p==='lib');
  $('hdr-icon').textContent=HDR[p].icon;
  $('hdr-title').textContent=HDR[p].title;
  $('hdr-sub').textContent=HDR[p].sub;
}

/* ═══════════════════════════
   BARCODE SCANNER (ZXing)
═══════════════════════════ */
async function startScan(){
  $('btn-start').disabled=true;
  $('cam-hint').textContent='Démarrage de la caméra…';
  try{
    codeReader=new ZXing.BrowserMultiFormatReader();

    // Trouver la caméra arrière via mediaDevices (compatible Android Chrome)
    const devices=await navigator.mediaDevices.enumerateDevices();
    const videoDevices=devices.filter(d=>d.kind==='videoinput');
    const backCam=videoDevices.find(d=>/(back|rear|environment)/i.test(d.label))
                 ||videoDevices[videoDevices.length-1];
    const deviceId=backCam?.deviceId||undefined;

    await codeReader.decodeFromVideoDevice(deviceId,'cam-video',async(result,err)=>{
      if(!result) return;
      const isbn=result.getText().replace(/[^0-9X]/g,'');
      if(!isbn||isbn===lastScannedISBN||scanCooldown) return;
      if(isbn.length!==10&&isbn.length!==13) return;
      lastScannedISBN=isbn;
      scanCooldown=true;
      setTimeout(()=>{scanCooldown=false;lastScannedISBN=''},4000);
      $('cam-isbn').textContent='ISBN : '+isbn;
      $('scan-err').style.display='none';
      await fetchBook(isbn);
    });

    scanning=true;
    $('btn-start').style.display='none';
    $('btn-stop').style.display='';
    $('cam-hint').textContent='Pointez vers un code-barres ISBN';

    // Torch support
    const stream=$('cam-video').srcObject;
    if(stream){
      const track=stream.getVideoTracks()[0];
      const caps=track.getCapabilities?.();
      if(caps?.torch){torchTrack=track;$('btn-torch').style.display=''}
    }
  }catch(e){
    $('btn-start').disabled=false;
    $('cam-hint').textContent='Erreur : '+e.message;
  }
}

function stopScan(){
  if(codeReader){codeReader.reset();codeReader=null}
  scanning=false;torchOn=false;torchTrack=null;
  $('btn-start').style.display='';$('btn-start').disabled=false;
  $('btn-stop').style.display='none';$('btn-torch').style.display='none';
  $('cam-isbn').textContent='';
  $('cam-hint').textContent='Pointez vers un code-barres ISBN';
}

async function toggleTorch(){
  if(!torchTrack) return;
  torchOn=!torchOn;
  await torchTrack.applyConstraints({advanced:[{torch:torchOn}]});
  $('btn-torch').textContent=torchOn?'💡':'🔦';
}

/* ═══════════════════════════
   FETCH BOOK INFO
═══════════════════════════ */
async function fetchBook(isbn){
  $('ldr').classList.add('on');
  $('lbl').textContent='Recherche du livre…';
  $('pending-wrap').innerHTML='';

  try{
    // Open Library ISBN API
    const url=`https://openlibrary.org/api/books?bibkeys=ISBN:${isbn}&format=json&jscmd=data`;
    const res=await fetch(url);
    const data=await res.json();
    const key=`ISBN:${isbn}`;
    const book=data[key];

    if(!book) throw new Error(`ISBN ${isbn} introuvable dans Open Library`);

    const title=book.title||'Titre inconnu';
    const authors=(book.authors||[]).map(a=>a.name).join(', ')||'';
    const year=book.publish_date?.match(/\d{4}/)?.[0]||'';
    const publisher=(book.publishers||[]).map(p=>p.name).join(', ')||'';
    const pages=book.number_of_pages||'';
    const subjects=(book.subjects||[]).map(s=>s.name||s).slice(0,3);
    const genre=guessGenre(subjects,title);
    const language=(book.languages||[]).map(l=>l.key?.replace('/languages/',''))[0]||'';
    const langLabel={'fre':'Français','eng':'Anglais','spa':'Espagnol','ger':'Allemand','ita':'Italien','por':'Portugais'}[language]||language.toUpperCase()||'';
    const coverUrl=book.cover?.medium||book.cover?.small||'';

    const entry={
      isbn,title,author:authors,year,publisher,genre,language:langLabel,
      pages:pages?String(pages):'',subjects:subjects.join(', '),coverUrl,
      id:uid(),addedAt:Date.now()
    };

    $('ldr').classList.remove('on');
    showPending(entry);

  }catch(e){
    $('ldr').classList.remove('on');
    $('scan-err-msg').textContent=e.message;
    $('scan-err').style.display='';
  }
}

function guessGenre(subjects,title){
  const txt=(subjects.join(' ')+' '+title).toLowerCase();
  if(/roman|fiction|novel|story/.test(txt)) return 'Roman';
  if(/science.?fic|sf|scifi|futur/.test(txt)) return 'Science-Fiction';
  if(/polar|crime|thriller|myst/.test(txt)) return 'Policier';
  if(/histor/.test(txt)) return 'Histoire';
  if(/biograph|memoir/.test(txt)) return 'Biographie';
  if(/philosoph/.test(txt)) return 'Philosophie';
  if(/essay|essai/.test(txt)) return 'Essai';
  if(/child|jeunes|youth|kid/.test(txt)) return 'Jeunesse';
  if(/comic|manga|bd|bande/.test(txt)) return 'BD/Manga';
  if(/cook|recette|cuisine/.test(txt)) return 'Cuisine';
  if(/art|paint|photo/.test(txt)) return 'Art';
  if(/scien|biolog|physic|chimi/.test(txt)) return 'Science';
  if(/develop|self.help/.test(txt)) return 'Développement';
  return 'Autre';
}

/* ═══════════════════════════
   PENDING CARD
═══════════════════════════ */
function showPending(entry){
  const inLib=library.some(b=>b.isbn===entry.isbn);
  $('pending-wrap').innerHTML=`
    <div class="pending-card">
      <div class="pending-cover">
        ${entry.coverUrl
          ?`<img class="cover-img" src="${entry.coverUrl}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" loading="lazy"/><div class="cover-placeholder" style="display:none">📖</div>`
          :`<div class="cover-placeholder">📖</div>`}
        <div class="pending-meta">
          <div class="pending-title">${esc(entry.title)}</div>
          ${entry.author?`<div class="pending-author">— ${esc(entry.author)}</div>`:''}
          <div class="pending-tags">
            ${entry.year?`<span class="t yr">${entry.year}</span>`:''}
            ${entry.language?`<span class="t ln">${esc(entry.language)}</span>`:''}
            ${entry.genre?`<span class="t gn">${esc(entry.genre)}</span>`:''}
            ${entry.pages?`<span class="t ln">${entry.pages} p.</span>`:''}
          </div>
          <div class="pending-isbn">ISBN ${entry.isbn}${entry.publisher?' · '+esc(entry.publisher):''}</div>
        </div>
      </div>
      <div class="pending-actions">
        ${inLib
          ?`<button class="btn-action skip" onclick="$('pending-wrap').innerHTML=''" style="flex:1">✓ Déjà dans la bibliothèque</button>`
          :`<button class="btn-action add" onclick="addBook(${JSON.stringify(entry).replace(/"/g,'&quot;')})">＋ Ajouter</button>
            <button class="btn-action skip" onclick="$('pending-wrap').innerHTML=''">Ignorer</button>`
        }
      </div>
    </div>`;
}

/* ═══════════════════════════
   LIBRARY CRUD
═══════════════════════════ */
function updateBadge(){$('hdr-badge').textContent=library.length+' livre'+(library.length>1?'s':'')}

async function addBook(entry){
  if(typeof entry==='string') entry=JSON.parse(entry);
  if(library.some(b=>b.isbn===entry.isbn)){toast('Déjà dans la bibliothèque');return}
  library.unshift(entry);
  await saveLib();
  sessionBooks.unshift(entry);
  renderSession();
  $('pending-wrap').innerHTML='';
  toast('Ajouté ✓');
}

async function removeBook(id){
  library=library.filter(b=>b.id!==id);
  await saveLib();renderLib();toast('Retiré');
}

async function clearLib(){
  if(!library.length) return;
  if(!confirm(`Supprimer les ${library.length} livres ?`)) return;
  library=[];await saveLib();renderLib();
}

/* ═══════════════════════════
   SESSION LIST
═══════════════════════════ */
function renderSession(){
  if(!sessionBooks.length){$('session-section').style.display='none';return}
  $('session-section').style.display='';
  $('session-list').innerHTML=sessionBooks.map(b=>`
    <div class="bk" style="margin-top:8px">
      <div class="bk-row">
        <div class="bk-body">
          <div class="bk-title">${esc(b.title)}</div>
          ${b.author?`<div class="bk-author">— ${esc(b.author)}</div>`:''}
        </div>
      </div>
      <div class="bk-tags">
        ${b.year?`<span class="t yr">${b.year}</span>`:''}
        ${b.language?`<span class="t ln">${esc(b.language)}</span>`:''}
        ${b.genre?`<span class="t gn">${esc(b.genre)}</span>`:''}
      </div>
    </div>`).join('');
}

/* ═══════════════════════════
   LIBRARY RENDER
═══════════════════════════ */
function setSort(s){
  currentSort=s;
  document.querySelectorAll('.sort-btn').forEach(b=>b.classList.toggle('on',b.dataset.s===s));
  renderLib();
}
function setGenre(g){currentGenre=g;renderLib()}
function onSearch(){$('s-clear').classList.toggle('visible',$('s-input').value.length>0);renderLib()}
function clearSearch(){$('s-input').value='';$('s-clear').classList.remove('visible');renderLib()}

function renderLib(){
  updateBadge();
  const q=norm($('s-input').value||'');
  const allGenres=[...new Set(library.map(b=>b.genre).filter(Boolean))].sort();

  // Genre select
  const sel=$('genre-select');
  sel.innerHTML=`<option value="all">Tous les genres (${library.length})</option>`
    +allGenres.map(g=>`<option value="${esc(g)}">${esc(g)} (${library.filter(b=>b.genre===g).length})</option>`).join('');
  if(allGenres.includes(currentGenre)) sel.value=currentGenre;
  else{currentGenre='all';sel.value='all'}

  if(!library.length){
    $('lib-empty').style.display='';$('lib-info').style.display='none';
    $('no-res').style.display='none';$('lib-list').innerHTML='';return
  }
  $('lib-empty').style.display='none';$('lib-info').style.display='';

  let list=library.filter(b=>{
    const mq=!q||norm(b.title).includes(q)||norm(b.author).includes(q)||norm(b.genre).includes(q)||norm(b.publisher).includes(q);
    const mg=currentGenre==='all'||b.genre===currentGenre;
    return mq&&mg;
  });

  list=[...list].sort((a,b)=>{
    if(currentSort==='date') return (b.addedAt||0)-(a.addedAt||0);
    if(currentSort==='title') return norm(a.title).localeCompare(norm(b.title),'fr');
    if(currentSort==='author') return norm(a.author).localeCompare(norm(b.author),'fr');
    if(currentSort==='year') return (b.year||'0').localeCompare(a.year||'0');
    return 0;
  });

  const authors=[...new Set(library.map(b=>b.author).filter(Boolean))];
  $('info-text').innerHTML=
    `<span>${library.length} livre${library.length>1?'s':''}</span>`
    +(list.length!==library.length?` · <em>${list.length} affiché${list.length>1?'s':''}</em>`:'')
    +` · <span>${authors.length} auteur${authors.length>1?'s':''}</span>`;

  if(!list.length){$('no-res').style.display='';$('lib-list').innerHTML='';return}
  $('no-res').style.display='none';

  $('lib-list').innerHTML=list.map((b,i)=>`
    <div class="bk" style="animation-delay:${Math.min(i*.025,.3)}s">
      <div class="bk-row">
        <div class="bk-n">${i+1}</div>
        <div class="bk-body">
          <div class="bk-title">${esc(b.title)}</div>
          ${b.author?`<div class="bk-author">— ${esc(b.author)}</div>`:''}
        </div>
        <button class="bk-del" onclick="removeBook('${b.id}')">✕</button>
      </div>
      <div class="bk-tags">
        ${b.year?`<span class="t yr">${b.year}</span>`:''}
        ${b.language?`<span class="t ln">${esc(b.language)}</span>`:''}
        ${b.genre?`<span class="t gn">${esc(b.genre)}</span>`:''}
        ${b.publisher?`<span class="t ln">${esc(b.publisher)}</span>`:''}
        ${b.pages?`<span class="t ln">${b.pages} p.</span>`:''}
      </div>
    </div>`).join('');
}

/* ═══════════════════════════
   EXPORT / IMPORT
═══════════════════════════ */
function exportCSV(){
  if(!library.length) return;
  const h=['#','Titre','Auteur','Année','Genre','Langue','Éditeur','Pages','ISBN'];
  const rows=library.map((b,i)=>[i+1,b.title||'',b.author||'',b.year||'',b.genre||'',b.language||'',b.publisher||'',b.pages||'',b.isbn||'']);
  const csv=[h,...rows].map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'}));
  a.download='ma_bibliotheque.csv';a.click();
}

function exportJSON(){
  if(!library.length){toast('Bibliothèque vide');return}
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(library,null,2)],{type:'application/json'}));
  a.download='ma_bibliotheque.json';a.click();
  toast('Sauvegarde téléchargée ✓');
}

function importJSON(){
  const inp=document.createElement('input');
  inp.type='file';inp.accept='.json,application/json';
  inp.onchange=async e=>{
    const f=e.target.files[0];if(!f) return;
    try{
      const data=JSON.parse(await f.text());
      if(!Array.isArray(data)) throw new Error();
      const existing=new Set(library.map(b=>b.isbn||b.id));
      let n=0;
      data.forEach(b=>{if(!existing.has(b.isbn||b.id)){library.push(b);n++}});
      await saveLib();renderLib();
      toast(`${n} livre${n>1?'s':''} importé${n>1?'s':''} ✓`);
    }catch{toast('Fichier invalide')}
  };inp.click();
}

/* ═══════════════════════════
   UTILS
═══════════════════════════ */
function norm(s){return(s||'').toLowerCase().trim()}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

let _toastT=null;
function toast(msg){
  const el=$('toast');el.textContent=msg;el.classList.add('show');
  clearTimeout(_toastT);_toastT=setTimeout(()=>el.classList.remove('show'),2200);
}

/* ═══════════════════════════
   INIT
═══════════════════════════ */
(async()=>{await initLib();renderLib()})();
</script>
